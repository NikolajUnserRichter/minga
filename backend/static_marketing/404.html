<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seite nicht gefunden — NovaERP</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%23F6F1EA' stroke-width='3'/%3E%3Cpath d='M32 7 L36 28 L57 32 L36 36 L32 57 L28 36 L7 32 L28 28 Z' fill='%23C0814F'/%3E%3C/svg%3E" />
  <style>
    :root {
      --abyss: #0a0a0a;
      --bronze: #C0814F;
      --ink-0: #F6F1EA;
      --ink-2: #9A9288;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--abyss);
      color: var(--ink-0);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .code {
      font-size: clamp(3rem, 12vw, 5rem);
      font-weight: 700;
      line-height: 1;
      color: var(--bronze);
      margin: 0;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0.75rem 0 0.5rem; }
    p { color: var(--ink-2); margin: 0 0 2rem; }
    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 0.6rem;
      background: var(--bronze);
      color: var(--abyss);
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #D8A06E; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Diese Seite gibt es nicht</h1>
    <p>Der Link ist veraltet oder enthält einen Tippfehler.</p>
    <a href="/">Zur Startseite</a>
  </main>
</body>
</html>
